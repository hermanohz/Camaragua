<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brl=n=>(+n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toLocaleDateString("sv");
const fdate=d=>d?d.split("-").reverse().join("/"):"";
const S={clients:[],products:[],sales:[],payments:[],settings:[],analyses:[],visits:[],consult:[],ponds:[],ciclos:[],stock:[],compras:[]};
let db=null,tab="vendas",loaded=0,ME="Hermano",unsubs=[];
const TABS=[["vendas","Pedidos"],["pagar","Pagamentos"],["clientes","Clientes"],["produtos","Produtos"],["analises","Análises"],["consult","Consultoria"],["agenda","Agenda"],["estoque","Estoque"],["compras","Compras"]];
const isPaid=s=>s.status?s.status==="pago":!!s.pag;
const RATE=0.05;
let toastT=0;
function toast(t,k){let e=$("#toast");if(!e){e=document.createElement("div");e.id="toast";e.style.cssText="position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:2147483647;padding:12px 14px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 4px 16px #0004;text-align:center";e.onclick=()=>e.remove();}
  const d=$("#dlg");(d&&d.open?d:document.body).appendChild(e);
  e.style.background=k==="ok"?"var(--ok)":k==="bad"?"var(--ac)":"var(--pr)";e.style.color="#fff";e.textContent=t;
  clearTimeout(toastT);if(k==="ok")toastT=setTimeout(()=>e.remove(),3000)}

/* ---------- recebimentos, vencimento, mensagens e filtros ---------- */
const r2=n=>Math.round((+n||0)*100)/100;
const pagtosOf=s=>Array.isArray(s.pagtos)?s.pagtos:[];
const paidAmt=s=>isPaid(s)?(+s.total||0):r2(pagtosOf(s).reduce((a,p)=>a+(+p.v||0),0));
const owed=s=>isPaid(s)?0:Math.max(0,r2((+s.total||0)-paidAmt(s)));
const overdue=s=>!isPaid(s)&&!!s.venc&&s.venc<today();
const recEvents=s=>{const P=pagtosOf(s);return P.length?P.map(p=>({d:p.d||"",v:+p.v||0})):isPaid(s)?[{d:s.dpag||s.data||"",v:+s.total||0}]:[]};
const recIn=mes=>r2(S.sales.reduce((a,s)=>a+recEvents(s).reduce((x,e)=>x+(e.d.startsWith(mes)?e.v:0),0),0));
const stTag=s=>isPaid(s)?'<span class="tag ok">Pago</span>':overdue(s)?'<span class="tag al">Vencido</span>':pagtosOf(s).length?'<span class="tag al">Parcial</span>':'<span class="tag al">A receber</span>';
const cliOf=id=>S.clients.find(x=>x.id===id);
const foneOf=c=>((c&&c.fone)||"").replace(/\D/g,"");
const nome1=n=>String(n||"").trim().split(/\s+/)[0]||"";
const waLink=(n,t)=>"https://wa.me/55"+n+(t?"?text="+encodeURIComponent(t):"");
const cidOf=s=>s.cidade||(cliOf(s.clientId)||{}).cidade||"";
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const mesNome=m=>MESES[+m.slice(5,7)-1]+" de "+m.slice(0,4);
const mesCurto=m=>MESES[+m.slice(5,7)-1].slice(0,3)+"/"+m.slice(2,4);
const addM=(m,n)=>{let y=+m.slice(0,4),k=+m.slice(5,7)-1+n;y+=Math.floor(k/12);k=((k%12)+12)%12;return y+"-"+String(k+1).padStart(2,"0")};
const F={pq:"",ps:"",pm:"",cq:"",cs:"",cc:""};
function payInfo(s){
  const P=pagtosOf(s),L=[];
  if(!isPaid(s)&&P.length)L.push(`Recebido ${brl(paidAmt(s))} de ${brl(s.total)} · <b>falta ${brl(owed(s))}</b>`);
  if(P.length>1||(!isPaid(s)&&P.length))L.push(P.map(p=>`${fdate(p.d)}: ${brl(p.v)} (${esc(p.pag)})`).join(" · "));
  if(!isPaid(s)&&s.venc)L.push(overdue(s)?`<span style="color:var(--ac)">Venceu em ${fdate(s.venc)} (há ${daysSince(s.venc)} dia(s))</span>`:`Vence em ${fdate(s.venc)}`);
  return L.length?`<div class="mu" style="margin-top:4px">${L.join("<br>")}</div>`:"";
}
function cobMsg(s){
  const px=S.settings.find(x=>x.id==="pix")||{},items=s.items||[{nome:s.productName,qtd:s.qtd,preco:s.preco}],pg=paidAmt(s);
  let t=`Olá, ${nome1(s.clientName)}! Tudo bem? Passando para lembrar do seu pedido de ${fdate(s.data)} no Laboratório Camarágua:\n\n`;

function cliBox(root){

    if(sel.dataset.cb)return;sel.dataset.cb="1";

    inp.value=cur()?cur().t:"";
    if(sel.disabled){inp.disabled=true;return}
    let m=[],novo="",busy=false;
    const show=()=>{novo="";const raw=inp.value.trim(),q=normT(raw);m=opts.filter(o=>!q||normT(o.t).includes(q)).slice(0,40);
      const exato=raw&&opts.some(o=>normT(o.t).split(" · ")[0].replace(/ \(revenda\)$/,"")===q);

      L.innerHTML=h||'<div class="mu" style="padding:10px">Digite o nome do cliente. Se não existir, dá para cadastrar aqui mesmo.</div>';L.hidden=false};
    const pick=v=>{sel.value=v;inp.value=cur()?cur().t:"";L.hidden=true;inp.blur();sel.dispatchEvent(new Event("change",{bubbles:true}))};
    const quick=()=>{novo=inp.value.trim();if(!novo)return;
      L.innerHTML=`<div style="padding:10px"><div class="b">Novo cliente: ${esc(novo)}</div>
        <label style="margin:6px 0">WhatsApp (com DDD, opcional)<input data-nf="fone" type="tel" inputmode="tel"></label>
        <label style="margin:6px 0">Cidade (opcional)<input data-nf="cidade" autocapitalize="words"></label>
        <label style="margin:6px 0">Tipo<select data-nf="tipo"><option>Consumidor final</option><option>Revendedor</option></select></label>
        <div class="dlgrow" style="margin-top:8px"><button type="button" class="ghost" data-nvolta="1">Voltar</button><button type="button" class="pri" data-nsalva="1">Cadastrar e usar</button></div>
        <div class="mu" style="margin-top:6px">Os outros dados podem ser completados depois na aba Clientes.</div></div>`;
      L.hidden=false;const f1=L.querySelector('[data-nf="fone"]');if(f1)f1.focus()};
    const salvar=async btn=>{if(busy)return;const nome=novo.trim();if(!nome)return;
      if(!db)return alert("Aguarde a conexão.");
      busy=true;btn.disabled=true;btn.textContent="Cadastrando…";
      const g=k=>{const e=L.querySelector(`[data-nf="${k}"]`);return e?e.value.trim():""};
      const id=uid(),rec={nome,fone:g("fone"),cidade:g("cidade"),fazenda:"",origem:"Outro",tipo:g("tipo")||"Consumidor final",desc:0,obs:"Cadastrado no lançamento do pedido",ts:Date.now()};
      try{await save("clients",id,rec);
        if(!S.clients.some(c=>c.id===id))S.clients.push({id,...rec});
        const t=nome+(rec.cidade&&/·/.test(opts.map(o=>o.t).join(""))?" · "+rec.cidade:"");
        const o=document.createElement("option");o.value=id;o.textContent=t;sel.appendChild(o);opts.push({v:id,t});
        novo="";busy=false;pick(id)}
      catch(x){busy=false;btn.disabled=false;btn.textContent="Cadastrar e usar";alert("Não foi possível cadastrar: "+(x&&x.message||x))}};
    inp.addEventListener("focus",()=>{inp.value="";show()});
    inp.addEventListener("input",show);
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(m.length)pick(m[0].v);else if(inp.value.trim())quick()}if(e.key==="Escape"){L.hidden=true;inp.blur()}});
    ["mousedown","pointerdown"].forEach(t=>L.addEventListener(t,e=>{if(!e.target.closest("input,select"))e.preventDefault()}));
    L.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input")){e.preventDefault();const b=L.querySelector("[data-nsalva]");if(b)salvar(b)}});
    L.addEventListener("click",e=>{const b=e.target.closest("[data-cv]");if(b)return pick(b.dataset.cv);

    inp.addEventListener("blur",()=>setTimeout(()=>{if(w.contains(document.activeElement)||novo||busy)return;L.hidden=true;inp.value=cur()?cur().t:""},250));
  });
}

function priceFor(cid,pid){
  const p=S.products.find(x=>x.id===pid),c=S.clients.find(x=>x.id===cid);
  if(!p)return 0;
  if(c&&c.tipo==="Revendedor"&&p.rev)return Math.round(p.preco*(1-(+c.desc||0)/100)*100)/100;
  return +p.preco;
}

const vUn=s=>String(s||"").replace(/\\n/gi," ").replace(/\\([,;:\\])/g,"$1").trim();
function vQP(s){try{const b=[];s.replace(/=\n/g,"").replace(/=([0-9A-F]{2})|([^=])/gi,(m,h,c)=>{if(h)b.push(parseInt(h,16));else b.push(...new TextEncoder().encode(c));return""});return new TextDecoder().decode(new Uint8Array(b))}catch(e){return s}}
function fmtFone(raw){let d=String(raw||"").replace(/\D/g,"");if(d.length>=12&&d.startsWith("55"))d=d.slice(2);if(d.length>=11&&d.startsWith("0"))d=d.slice(1);
  if(d.length===11)return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return d}
function vcfParse(t){
  t=t.replace(/\r\n?/g,"\n").replace(/\n[ \t]/g,"");
  return t.split(/BEGIN:VCARD/i).slice(1).map(b=>{
    const c={nome:"",fone:"",cidade:"",fazenda:"",obs:""},tels=[];let n="";
    b.split("\n").forEach(l=>{const i=l.indexOf(":");if(i<0)return;const key=l.slice(0,i);let raw=l.slice(i+1);
      if(/QUOTED-PRINTABLE/i.test(key))raw=vQP(raw);
      const nm=key.split(";")[0].split(".").pop().toUpperCase();
      if(nm==="FN")c.nome=vUn(raw);
      else if(nm==="N")n=raw.split(";").slice(0,2).map(vUn).reverse().filter(Boolean).join(" ");
      else if(nm==="TEL")tels.push({v:raw,cell:/CELL|IPHONE|MOBILE/i.test(key)});
      else if(nm==="ORG"&&!c.fazenda)c.fazenda=vUn(raw.split(";")[0]);
      else if(nm==="ADR"&&!c.cidade)c.cidade=vUn(raw.split(";")[3]);
      else if(nm==="NOTE")c.obs=vUn(raw)});
    if(!c.nome)c.nome=n;
    const t1=tels.find(x=>x.cell)||tels[0];if(t1)c.fone=fmtFone(t1.v);
    if(!c.nome)c.nome=c.fone;
    return c}).filter(c=>c.nome);
}

/* ---------- relatório do ciclo ---------- */
function parseDose(s){
  const t=normT(s).replace(/\s/g,"").replace(",",".");

}
const fmtQ=(v,u)=>u==="g"?(v>=1000?(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" kg":v.toLocaleString("pt-BR",{maximumFractionDigits:0})+" g"):(v>=1000?(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" L":v.toLocaleString("pt-BR")+" mL");
const INS=[["gesso","Gesso agrícola","sum"],["calc","Calcário dolomítico","sum"],["cal","Cal hidratada","sum"],["epzin","EPZIN G2","sum"],["mel","Melaço","sum"],["pst","PST","sum"],["sil","Silicato","sum"],["boc","Bocashi","sum"],["kcl","Cloreto de potássio (diário, na 1ª ração)","daily"],["fmc","FMC (a cada 10 kg de ração)","racao"],["aer","Aeradores no horário mais quente","weeks"]];
function cicloData(cy){
  const R=cicloRegs(cy),PP=cpP();
  const par=PP.map(p=>{const pts=R.map(x=>({d:x.data,v:calcVals(x.vv.vals).v[p.k]})).filter(x=>x.v!=null).map(x=>({d:x.d,v:x.v==="ND"?0:+x.v,nd:x.v==="ND"}));
    const vs=pts.map(x=>x.v),fo=pts.filter(x=>{const s=stat(p,x.nd?"ND":x.v);return s==="baixo"||s==="alto"}).length;
    return{p,pts,n:vs.length,avg:vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null,min:vs.length?Math.min(...vs):null,max:vs.length?Math.max(...vs):null,fo}});
  const dd=(a,b)=>Math.max(0,Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5));
  R.forEach((x,i)=>{x.span=i<R.length-1?dd(x.data,R[i+1].data):dd(x.data,cy.fim||today())});
  const totDias=R.reduce((a,x)=>a+x.span,0),rac=num(cy.racao);
  const ins=INS.map(([k,l,modo])=>{const on=R.filter(x=>x.vv.man&&manOn(x.vv.man[k]));let txt="—";
    if(on.length){if(modo==="sum"){let g=0,ml=0,bad=0;on.forEach(x=>{const q=parseDose(x.vv.man[k]);if(!q)bad++;else if(q.u==="g")g+=q.v;else ml+=q.v});txt=[g?fmtQ(g,"g"):"",ml?fmtQ(ml,"ml"):""].filter(Boolean).join(" + ")||"—";if(bad)txt+=` (+${bad} sem valor)`}
      else if(modo==="daily"){let g=0,dias=0;on.forEach(x=>{const q=parseDose(x.vv.man[k]);if(q&&q.u==="g"){g+=q.v*x.span;dias+=x.span}});txt=g?`${fmtQ(g,"g")} (${dias} dias)`:"—"}
      else if(modo==="racao"){if(!rac)txt="informe a ração do ciclo";else if(totDias){let g=0;on.forEach(x=>{const q=parseDose(x.vv.man[k]);if(q&&q.u==="g")g+=q.v/10*rac*x.span/totDias});txt=g?fmtQ(g,"g"):"—"}}
      else txt="ligados"}
    return{l,sem:on.length,txt}});
  return{R,par,ins};
}
const nfmt=(v,d=2)=>v==null?"—":(+v).toLocaleString("pt-BR",{maximumFractionDigits:d});
function miniChart(o){
  const p=o.p,pts=o.pts,W=330,H=150,l=40,r=12,t=24,b=24;

  if(!pts.length)return`<div class="k-ch">${head}<div class="k-nd">Sem dados no ciclo</div></div>`;
  const refs=[p.min,p.max].filter(x=>x!=null);
  let lo=Math.min(...pts.map(x=>x.v),...refs),hi=Math.max(...pts.map(x=>x.v),...refs);if(hi===lo){hi=hi+1;lo=Math.max(0,lo-1)}
  const pad=(hi-lo)*.15;lo=Math.max(0,lo-pad);hi=hi+pad;
  const X=i=>pts.length===1?l+(W-l-r)/2:l+i*(W-l-r)/(pts.length-1),Y=v=>t+(H-t-b)*(1-(v-lo)/(hi-lo));

  const row=c=>{const ok=c.status==="comprado";return`<div class="card row" style="gap:10px"><button data-a="ck" data-id="${c.id}" style="flex:none;padding:6px 10px;font-size:18px${ok?";background:var(--ok);color:#fff;border-color:var(--ok)":""}">${ok?"✓":"&nbsp;&nbsp;"}</button>
  <div style="flex:1;min-width:0" data-a="ebu" data-id="${c.id}"><div class="b"${ok?' style="text-decoration:line-through;opacity:.7"':""}>${esc(c.nome)}</div><div class="mu">${fq(c.qtd)} ${esc(c.un||"")}${c.obs?" · "+esc(c.obs):""}${ok?` · comprado ${fdate(c.dcomp)}${c.somado?" · somado ao estoque":""}`:c.stockId?" · do estoque":""}</div></div></div>`};
  return `<div class="kpis"><div class="kpi"><div class="mu">Para comprar</div><div class="v" style="color:${P.length?"var(--ac)":"var(--ok)"}">${P.length}</div></div><div class="kpi"><div class="mu">Comprados</div><div class="v">${S.compras.length-P.length}</div></div></div>
  <button class="pri add" data-a="nbu">+ Adicionar item</button>${P.length?'<button class="add" data-a="shb">Compartilhar lista</button>':""}
  <div class="mu b" style="margin-top:10px">Para comprar</div>
  ${P.map(row).join("")||'<div class="card mu">Nada para comprar. 🎉</div>'}
  ${C.length?`<div class="row" style="margin-top:12px"><span class="mu b">Comprados</span><button class="ghost mu" data-a="clb" style="padding:4px 8px">Limpar</button></div>${C.map(row).join("")}`:""}`;
}
init();
</script>
</body>
</html>
